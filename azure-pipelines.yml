trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'dd84aaae-d79f-4df5-b6d2-2b7120556d25'
  webAppName: 'PracticaPipeline'  # SI ESTE ES EL NOMBRE REAL DE TU WEB APP

steps:
# 1. Instalar Node.js
- task: NodeTool@0
  inputs:
    versionSpec: '18.x'  # Cambiado de 20.x a 18.x
  displayName: 'Install Node.js'

# 2. Instalar dependencias
- script: |
    npm install
    npm run build --if-present
  displayName: 'npm install and build'

# 3. Crear archivo ZIP
- task: ArchiveFiles@2
  displayName: 'Create ZIP package'
  inputs:
    rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
    includeRootFolder: false
    archiveType: zip
    archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
    replaceExistingArchive: true

# 4. Desplegar en Azure
- task: AzureWebApp@1
  displayName: 'Deploy to Azure Web App'
  inputs:
    azureSubscription: '$(azureSubscription)'
    appType: 'webAppLinux'
    appName: '$(webAppName)'
    package: '$(Build.ArtifactStagingDirectory)/app.zip'
    # Si necesitas este parámetro, descomenta:
    # startUpCommand: 'npm start'