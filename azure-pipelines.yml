trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
# 1. Checkout explícito (evita templates)
- checkout: self
  displayName: 'Checkout code'

# 2. Instalar Node.js 20.x
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js 20.x'

# 3. Instalar dependencias (solo si hay package.json)
- script: |
    if [ -f "package.json" ]; then
      npm install
      npm run build --if-present
    fi
  displayName: 'Install dependencies and build'

# 4. Crear paquete de despliegue
- task: ArchiveFiles@2
  displayName: 'Create deployment ZIP'
  inputs:
    rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
    includeRootFolder: false
    archiveType: zip
    archiveFile: '$(Build.ArtifactStagingDirectory)/deploy.zip'
    replaceExistingArchive: true

# 5. Desplegar en Azure Web App
- task: AzureWebApp@1
  displayName: 'Deploy to Azure'
  inputs:
    azureSubscription: 'dd84aaae-d79f-4df5-b6d2-2b7120556d25'
    appType: 'webAppLinux'
    appName: 'PracticaPipeline'  # ⚠️ VERIFICA: ¿Este es el nombre REAL?
    package: '$(Build.ArtifactStagingDirectory)/deploy.zip'
    # Si tu app necesita un comando de inicio:
    # startUpCommand: 'npm start'